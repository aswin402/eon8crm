services:
  - type: web
    name: eon8crm-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set to your Neon PostgreSQL connection string
      - key: REDIS_URL
        sync: false # Optional: Upstash or Render Redis connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # Set to your Vercel URL (e.g. https://your-crm.vercel.app)
