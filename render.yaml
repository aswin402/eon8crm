services:
  - type: web
    name: eon8crm-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: starter
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: eon8crm-db
          property: connectionString
      - key: REDIS_URL
        sync: false # Provide your Redis connection URL (e.g. from Upstash or Render Redis)
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # Set to your Vercel production URL (e.g. https://your-app.vercel.app)

databases:
  - name: eon8crm-db
    plan: starter
    databaseName: eon8crm
    user: eon8
